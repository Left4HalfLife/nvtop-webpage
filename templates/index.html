<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVTop Web App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Courier New', monospace; padding: 20px; }
        h1 { color: #4ecca3; margin-bottom: 20px; }
        .screen { background: #0f0f23; border: 2px solid #4ecca3; border-radius: 8px; padding: 15px; height: 60vh; overflow: auto; white-space: pre-wrap; font-size: 12px; line-height: 1.4; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .actions { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
        button { background: #4ecca3; color: #1a1a2e; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        button:hover { background: #3db892; }
        input { background: #0f0f23; color: #eee; border: 1px solid #4ecca3; padding: 12px; }
        .login { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .secondary { background: #555; color: #fff; }
        .hidden { display: none; }
        .status { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; }
        .status.success { background: #2d5a27; display: block; }
        .status.error { background: #8b2727; display: block; }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>NVTop Web App</h1>
        <button id="logout" class="secondary hidden" type="button">Log out</button>
    </div>
    <form id="login" class="login">
        <input id="user" name="user" autocomplete="username" value="nvtop-admin" aria-label="Username" required>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
        <button type="submit">Log in</button>
    </form>
    <div id="screen" class="screen">Log in to view GPU status.</div>
    <div id="status" class="status"></div>

    <div class="actions">
        {% for action in actions %}
        <button type="button" onclick='runAction({{ action.name|tojson }})'>{{ action.description }}</button>
        {% endfor %}
    </div>

    <script>
        const screen = document.getElementById('screen');
        const status = document.getElementById('status');
        const loginForm = document.getElementById('login');
        const logoutButton = document.getElementById('logout');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user: document.getElementById('user').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await response.json();
            if (!response.ok) {
                status.className = 'status error';
                status.textContent = data.error || 'Login failed';
                return;
            }
            loginForm.classList.add('hidden');
            logoutButton.classList.remove('hidden');
            status.className = 'status';
            await refreshScreen();
        });

        logoutButton.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            loginForm.classList.remove('hidden');
            logoutButton.classList.add('hidden');
            screen.textContent = 'Log in to view GPU status.';
        });

        async function refreshScreen() {
            try {
                const response = await fetch('/api/status');
                if (response.status === 401) return;
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Status request failed');
                screen.textContent = data.output || '';
            } catch (e) { screen.textContent = 'Error: ' + e.message; }
        }

        async function runAction(actionName) {
            status.className = 'status';
            status.style.display = 'block';
            try {
                const response = await fetch('/api/action/' + actionName, {
                    headers: { 'Content-Type': 'application/json' },
                    method: 'POST', body: '{}'
                });
                const data = await response.json();
                if (response.ok) {
                    status.className = 'status success';
                    status.textContent = data.message || actionName + ' completed';
                    setTimeout(refreshScreen, 1000);
                } else {
                    throw new Error(data.error || 'Failed');
                }
            } catch (e) { status.className = 'status error'; status.textContent = e.message; }
        }
        setInterval(refreshScreen, 2000);
    </script>
</body>
</html>
