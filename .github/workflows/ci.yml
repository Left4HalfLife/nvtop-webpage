name: CI - Test nvtop-webpage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        flake8 app.py config.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests (placeholder)
      run: |
        echo "Add pytest tests here when ready"
        python -m pytest tests/ 2>/dev/null || echo "No tests defined yet"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        docker build -t nvtop-webapp:${GITHUB_SHA} .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'nvtop-webapp:${GITHUB_SHA}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: CRITICAL,HIGH
